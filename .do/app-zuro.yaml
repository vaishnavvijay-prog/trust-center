# DigitalOcean App Platform spec — Zuro trust center
#
# Apply with:  doctl apps create --spec .do/app-zuro.yaml
# Update with: doctl apps update <APP_ID> --spec .do/app-zuro.yaml
#
# SECRETS ARE NOT IN THIS FILE. Values shown as CHANGEME must be set in the
# DO dashboard (or via `doctl`) as type: SECRET. Never commit real values.

name: zuro-trust-center
region: blr1   # closest to the Supabase project (ap-south-1 Mumbai)

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000

    github:
      repo: HQZuro/trust-center
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start

    health_check:
      http_path: /

    envs:
      # --- auth ---
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        value: https://trust.getzuro.com
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME
      - key: GITHUB_ID
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME
      - key: GITHUB_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME
      - key: ADMIN_EMAILS
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME

      # --- content store (shared Supabase project, this brand's schema) ---
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME
      - key: TRUST_DB_SCHEMA
        scope: RUN_AND_BUILD_TIME
        value: zuro
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME

      # --- branding (Zuro brand kit: dark-mode-first, violet accent on navy) ---
      # NOTE: Zuro is dark-mode-first — set `theme: dark` in the seed YAML content.
      - key: BRAND_NAME
        scope: RUN_AND_BUILD_TIME
        value: Zuro
      # --violet #5548FE — primary accent (links, eyebrows, focus, hero glow)
      - key: BRAND_PRIMARY
        scope: RUN_AND_BUILD_TIME
        value: oklch(0.5407 0.2561 276.7)
      # deep hero/CTA bases: --bg #0B101C -> --deep-purple #1A1033; glow = --violet-2 #A057FF
      - key: BRAND_INK
        scope: RUN_AND_BUILD_TIME
        value: "#0B101C"
      - key: BRAND_INK_2
        scope: RUN_AND_BUILD_TIME
        value: "#1A1033"
      - key: BRAND_GLOW
        scope: RUN_AND_BUILD_TIME
        value: "#A057FF"
      - key: BRAND_FONT
        scope: RUN_AND_BUILD_TIME
        value: Figtree
      - key: BRAND_FONT_WEIGHTS
        scope: RUN_AND_BUILD_TIME
        value: "400;500;600;700;800"
      - key: BRAND_FOOTER
        scope: RUN_AND_BUILD_TIME
        value: "© 2026 Zuro"

domains:
  - domain: trust.getzuro.com
    type: PRIMARY
