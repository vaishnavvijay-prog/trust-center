# DigitalOcean App Platform spec — Astridex trust center
#
# Apply with:  doctl apps create --spec .do/app-astridex.yaml
# Update with: doctl apps update <APP_ID> --spec .do/app-astridex.yaml
#
# SECRETS ARE NOT IN THIS FILE. Values shown as CHANGEME must be set in the
# DO dashboard (or via `doctl`) as type: SECRET. Never commit real values.

name: astridex-trust-center
region: blr1   # closest to the Supabase project (ap-south-1 Mumbai)

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000

    github:
      repo: HQZuro/trust-center
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start

    health_check:
      http_path: /

    envs:
      # --- auth ---
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        value: https://trust.astridex.com
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME
      - key: GITHUB_ID
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME
      - key: GITHUB_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME
      - key: ADMIN_EMAILS
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME

      # --- content store (shared Supabase project, this brand's schema) ---
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME
      - key: TRUST_DB_SCHEMA
        scope: RUN_AND_BUILD_TIME
        value: astridex
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME

      # --- branding (Astridex brand kit: green accent on forest, Open Sans) ---
      - key: BRAND_NAME
        scope: RUN_AND_BUILD_TIME
        value: Astridex
      # --accent (Astridex Green) #006241 — brand/CTA/links/eyebrows
      - key: BRAND_PRIMARY
        scope: RUN_AND_BUILD_TIME
        value: oklch(0.4384 0.0965 161.7)
      # deep hero/CTA bases: --forest #04362A -> --emerald #0E875C; glow = --spring #38C786
      - key: BRAND_INK
        scope: RUN_AND_BUILD_TIME
        value: "#04362A"
      - key: BRAND_INK_2
        scope: RUN_AND_BUILD_TIME
        value: "#0E875C"
      - key: BRAND_GLOW
        scope: RUN_AND_BUILD_TIME
        value: "#38C786"
      - key: BRAND_FONT
        scope: RUN_AND_BUILD_TIME
        value: Open Sans
      - key: BRAND_FONT_WEIGHTS
        scope: RUN_AND_BUILD_TIME
        value: "300;400;600;700;800"
      - key: BRAND_FOOTER
        scope: RUN_AND_BUILD_TIME
        value: "© 2026 Astridex"

domains:
  - domain: trust.astridex.com
    type: PRIMARY
