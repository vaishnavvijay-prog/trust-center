# DigitalOcean App Platform spec — Dashverge trust center
#
# Apply with:  doctl apps create --spec .do/app-dashverge.yaml
# Update with: doctl apps update <APP_ID> --spec .do/app-dashverge.yaml
#
# SECRETS ARE NOT IN THIS FILE. Values shown as CHANGEME must be set in the
# DO dashboard (or via `doctl`) as type: SECRET. Never commit real values.

name: dashverge-trust-center
region: blr1   # closest to the Supabase project (ap-south-1 Mumbai)

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000

    github:
      repo: HQZuro/trust-center
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start

    health_check:
      http_path: /

    envs:
      # --- auth ---
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        value: https://trust.dashverge.com
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME
      - key: GITHUB_ID
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME
      - key: GITHUB_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME
      - key: ADMIN_EMAILS
        scope: RUN_AND_BUILD_TIME
        value: CHANGEME

      # --- content store (Cloudflare D1: dashverge-trust-d1) ---
      - key: CF_ACCOUNT_ID
        scope: RUN_AND_BUILD_TIME
        value: bf9bd00305d0e4011b60a5539693848c
      - key: CF_D1_ID
        scope: RUN_AND_BUILD_TIME
        value: d4eee0df-18b4-4e1a-976f-4b33f0cc2de1
      - key: CF_API_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGEME

      # --- branding ---
      - key: BRAND_NAME
        scope: RUN_AND_BUILD_TIME
        value: Dashverge
      - key: BRAND_PRIMARY
        scope: RUN_AND_BUILD_TIME
        value: oklch(0.5569 0.1874 261.2)
      - key: BRAND_FONT
        scope: RUN_AND_BUILD_TIME
        value: Open Sans
      - key: BRAND_FOOTER
        scope: RUN_AND_BUILD_TIME
        value: "© 2026 Zuro"

domains:
  - domain: trust.dashverge.com
    type: PRIMARY
